<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desk Pet Bridge</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="popover">
      <header class="header">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <div>
            <h1>Desk Pet</h1>
            <p id="subtitle">Waiting for device</p>
          </div>
        </div>
        <span id="badge" class="badge badge-off">OFFLINE</span>
      </header>

      <section>
        <h2>Connection</h2>
        <div class="cards">
          <article>
            <span class="card-label">Queue</span>
            <strong id="queue">0</strong>
          </article>
          <article>
            <span class="card-label">Last event</span>
            <strong id="last-event">—</strong>
          </article>
        </div>
        <button id="reconnect" class="row-btn" type="button">
          <span>
            <span class="row-title">Reconnect</span>
            <span class="row-sub">Scan again for DP-xxxx</span>
          </span>
        </button>
      </section>

      <section>
        <h2>Pairing</h2>
        <label class="switch-row">
          <span>
            <span class="row-title">Pairing window</span>
            <span class="row-sub">Open a 120s window for a new bond</span>
          </span>
          <input id="pairing-toggle" type="checkbox" />
        </label>
      </section>

      <section>
        <h2>Pet</h2>
        <div class="cards three">
          <article>
            <span class="card-label">Mode</span>
            <strong id="pet-mode">wander</strong>
          </article>
          <article>
            <span class="card-label">State</span>
            <strong id="pet-state">idle</strong>
          </article>
          <article>
            <span class="card-label">Error</span>
            <strong id="last-error">none</strong>
          </article>
        </div>
        <button id="test-pet" class="row-btn" type="button">
          <span>
            <span class="row-title">Test pet</span>
            <span class="row-sub">Send a coding sessionStart</span>
          </span>
        </button>
      </section>

      <section>
        <h2>Loopback</h2>
        <div class="port-row">
          <span>
            <span class="row-title">127.0.0.1</span>
            <span id="loopback-hint" class="row-sub">Cursor hooks POST here</span>
          </span>
          <div class="port-edit">
            <label class="port-field">
              <span>Port</span>
              <input id="loopback-port" type="number" min="1" max="65535" step="1" value="8765" />
            </label>
            <button id="cancel-port" class="port-btn port-btn-cancel" type="button" aria-label="Cancel" title="Cancel">
              <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                <path d="M4 4l8 8M12 4l-8 8" />
              </svg>
            </button>
            <button id="apply-port" class="port-btn port-btn-apply" type="button" aria-label="Apply" title="Apply">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3.2 8.2l3.2 3.2 6.4-6.4" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <div id="forget-confirm" class="confirm" hidden>
        <p>Erase stored bonds? You will need to pair again.</p>
        <div class="confirm-actions">
          <button id="forget-no" type="button">Cancel</button>
          <button id="forget-yes" class="destructive" type="button">Erase</button>
        </div>
      </div>

      <footer>
        <button id="forget" type="button">Forget</button>
        <button id="quit" type="button">Quit</button>
      </footer>
    </div>
  </body>
</html>
