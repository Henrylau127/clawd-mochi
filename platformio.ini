; Desk Pet firmware - ESP32-C3 Super Mini + ST7789
; Use: ~/.platformio/penv/bin/pio run -e esp32-c3-super-mini

[platformio]
default_envs = esp32-c3-super-mini
test_dir = test

[env:esp32-c3-super-mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit BusIO
  h2zero/NimBLE-Arduino@^2.3.4
  bblanchon/ArduinoJson@^7

[env:esp32-c3-super-mini-debug]
extends = env:esp32-c3-super-mini
build_flags =
  ${env:esp32-c3-super-mini.build_flags}
  -DDESKPET_DEBUG=1

[env:native]
platform = native
test_build_src = true
build_src_filter =
  +<utils/JsonProtocol.cpp>
  +<clawd_mochi_base/States.cpp>
  +<transport/PairingWindow.cpp>
  -<utils/SerialDiag.cpp>
  -<utils/Backlight.cpp>
  -<clawd_mochi_base/Display.cpp>
  -<clawd_mochi_base/Face.cpp>
build_flags =
  -std=c++17
  -I src/utils
  -I src/clawd_mochi_base
  -I src/transport
lib_deps = bblanchon/ArduinoJson@^7

check_flags =
  cppcheck: --suppress=preprocessorErrorDirective --suppress=unusedFunction
